name: letizia
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0
  - tifffile>=2023.7.10
  - matplotlib>=3.7
  - pyyaml>=6.0
  - pytest>=7.4
  - pip
# After creating the env, install the package itself in editable mode from the
# repo root:  conda run -n letizia pip install -e .
