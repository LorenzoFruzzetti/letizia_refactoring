  BFDL: {row_start: 17, row_end: 22, col_start: -42, col_end: -37}
  TrL: {row_start: 18, row_end: 23, col_start: -26, col_end: -21}
  FLL: {row_start: 0, row_end: 5, col_start: -32, col_end: -27}
  HLL: {row_start: 7, row_end: 12, col_start: -22, col_end: -17}
  RSL_alta: {row_start: 25, row_end: 30, col_start: -9, col_end: -4}
  V1aL: {row_start: 27, row_end: 32, col_start: -28, col_end: -23}
