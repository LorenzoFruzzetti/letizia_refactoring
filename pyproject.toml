[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wfci"
version = "0.1.0"
description = "Wide-field calcium imaging: cerebellar ROI functional connectivity (Python port of the MATLAB pipeline)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "tifffile>=2023.7.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# roi_editor.py's interactive window. NOT a dependency of the `wfci` library --
# nothing under src/ imports pyqtgraph, and the editor keeps Qt out of module scope
# so `from roi_editor import load_roi_set` still works without this extra installed.
gui = ["pyqtgraph>=0.13", "pyside6>=6.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
